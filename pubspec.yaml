name: noorva_app
description: A premium Flutter application with Clean Architecture.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  path: ^1.9.0
  path_provider: ^2.1.5
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.9
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  sms_autofill: ^2.4.1
  dio: ^5.4.1
  percent_indicator: ^4.2.5
  intl: ^0.19.0
  equatable: ^2.0.5
  get: ^4.6.6
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^17.2.2
  rive: ^0.14.11
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#111113"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/rive/old_men_v9.riv
    - assets/rive/old_men_walk.riv
    - assets/audio/noorva_welcome.mp3
    # Loudness per 50 ms of noorva_welcome.mp3, drives the onboarding waveform.
    - assets/audio/noorva_welcome_levels.json
